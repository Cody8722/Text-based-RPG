# pytest 是選用的：專案本身只依賴標準庫，`python -m unittest discover -s tests` 一樣能跑全部快速測試。
#   pytest          → 快速測試（不需要 Ollama）
#   pytest -m llm   → 真模型整合測試（需要本機 Ollama 與 RPG_MODEL，預設 qwen3.5:9b；加 -s 可即時看到進度）
[pytest]
testpaths = tests tests_llm
python_files = test_*.py llm_*.py
markers =
    llm: real Ollama narrator tests (slow; need a local Ollama and the model)
addopts = -m "not llm"
